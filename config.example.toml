# buildloop config — copy to ~/.buildloop/config.toml
#
# Adding a project is three lines. `github_repo` enables the CI collector,
# `gradle_root` enables the local Gradle collector; set either or both.
# `gradle_root` must match `rootProject.name` in the project's settings.gradle.kts.

[[project]]
name        = "steady"
github_repo = "Zeyad-37/Steady"
gradle_root = "Steady"

[[project]]
name        = "pagecurl"
github_repo = "Zeyad-37/pagecurl"
gradle_root = "pagecurl"
